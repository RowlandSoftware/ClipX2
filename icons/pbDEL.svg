<?xml version="1.0" encoding="UTF-8"?>
<!-- ClipX2 tool icon: pbDEL, Delete selected text. 48 x 48; export to pbDEL.png at 48 x 48 (Inkscape: File > Export, or
     inkscape pbDEL.svg --export-type=png --export-width=48 --export-filename=pbDEL.png). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Delete selected text</title>
  <line x1="6" y1="9" x2="42" y2="9" stroke="#1f2f8f" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="6" y1="39" x2="42" y2="39" stroke="#1f2f8f" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="4" y="17" width="40" height="14" rx="1.5" fill="#9ec5ff"/>
  <line x1="9" y1="24" x2="39" y2="24" stroke="#1f2f8f" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="15" y1="15" x2="33" y2="33" stroke="#e53935" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="33" y1="15" x2="15" y2="33" stroke="#e53935" stroke-width="3.6" stroke-linecap="round"/>
</svg>
