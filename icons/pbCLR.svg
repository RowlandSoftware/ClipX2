  <line x1="8" y1="10" x2="40" y2="10" stroke="#1f2f8f" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="8" y1="21.5" x2="40" y2="21.5" stroke="#1f2f8f" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="8" y1="33" x2="40" y2="33" stroke="#1f2f8f" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="12" y1="38" x2="36" y2="10" stroke="#e53935" stroke-width="3.6" stroke-linecap="round"/>
</svg>
