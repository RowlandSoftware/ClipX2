<!-- ClipX2 tool icon: pbCLR, Clear selection. 48 x 48; export to pbCLR.png at 48 x 48 (Inkscape: File > Export, or
     inkscape pbCLR.svg --export-type=png --export-width=48 --export-filename=pbCLR.png). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Clear selection</title>
