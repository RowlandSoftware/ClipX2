<?xml version="1.0" encoding="UTF-8"?>
<!-- ClipX2 tool icon: pbPST, Paste from clipboard. 48 x 48; export to pbPST.png at 48 x 48 (Inkscape: File > Export, or
     inkscape pbPST.svg --export-type=png --export-width=48 --export-filename=pbPST.png). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Paste from clipboard</title>
  <rect x="7" y="7" width="30" height="37" rx="3" fill="none" stroke="#1f2f8f" stroke-width="2.6"/>
  <rect x="15" y="3" width="14" height="8" rx="2" fill="#e53935"/>
  <rect x="21" y="18" width="22" height="26" rx="2" fill="white" stroke="#1f2f8f" stroke-width="2.4"/>
  <line x1="25" y1="25" x2="39" y2="25" stroke="#1f2f8f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="25" y1="31" x2="39" y2="31" stroke="#1f2f8f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="25" y1="37" x2="39" y2="37" stroke="#1f2f8f" stroke-width="2.4" stroke-linecap="round"/>
</svg>
